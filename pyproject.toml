[project]
name = "rk-cli"
version = "0.1.0"
description = "ResearchKit CLI - Setup tool for systematic research projects"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "typer",
    "rich",
    "httpx",
]

[project.scripts]
rk = "rk_cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
